services:
  postgres:
    image: postgres:15
    container_name: incident_reporting_db
    environment:
      POSTGRES_USER: incident_user
      POSTGRES_PASSWORD: incident_password
      POSTGRES_DB: incident_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - incident_network

volumes:
  postgres_data:

networks:
  incident_network:
